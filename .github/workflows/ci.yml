name: Python correctness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[token,structure,dev]" "numpy>=1.26" "openai>=1.46"
      - name: Syntax and fatal lint checks
        run: bash scripts/lint.sh
      - name: Unit and regression suite
        run: bash scripts/test.sh
