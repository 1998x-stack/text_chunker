name: Python correctness and retrieval smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies (no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[structure,token,dev]" "numpy>=1.26" "openai>=1.46"
          python -m pip check
      - name: Syntax and fatal lint gate
        run: bash scripts/lint.sh
      - name: Independent regression suite
        run: bash scripts/test.sh
      - name: Offline anchored retrieval benchmark
        run: bash scripts/eval.sh
